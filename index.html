<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon Walk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --accent:#c8102e; --card:#f4f1ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#aaa; --card:#232323; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; display:flex; gap:12px; align-items:flex-start; }
  header > div { flex:1; }
  select { font:inherit; font-size:14px; padding:6px; border-radius:8px; background:var(--bg); color:var(--fg); }
  h1 { font-size:18px; margin:0; }
  #status { color:var(--muted); font-size:14px; margin-top:2px; }
  #map { flex:1; }
  footer { padding:12px 16px; background:var(--card); display:flex; gap:12px; align-items:center; }
  #now { flex:1; font-size:15px; }
  button { font:inherit; border:0; border-radius:999px; padding:12px 20px; background:var(--accent); color:#fff; cursor:pointer; }
  .num { background:var(--accent); color:#fff; border-radius:50%; width:28px; height:28px;
         display:grid; place-items:center; font-weight:700; border:2px solid #fff; }
  .num.done { background:#888; }
  .dot { background:var(--accent); width:12px; height:12px; border-radius:50%; border:2px solid #fff; }
  .dot.done { background:#888; }
  footer { flex-wrap:wrap; }
  #txt { flex-basis:100%; font-size:14px; color:var(--muted); max-height:30vh; overflow:auto; }
  .small { background:transparent; color:var(--fg); border:1px solid var(--muted); padding:8px 12px; font-size:14px; }
</style>
</head>
<body>
<header>
  <div><h1 id="title">Loading…</h1><div id="status"></div></div>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select>
</header>
<div id="map"></div>
<footer>
  <div id="now"></div>
  <button id="speed" class="small">1x</button>
  <button id="btn">Start</button>
  <details id="txt"><summary id="readAlong"></summary><p id="words"></p></details>
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RADIUS = 30; // metres from a stop before its audio plays
const params = new URLSearchParams(location.search);
const demo = params.has('demo'); // tap the map to fake your location
const audio = new Audio();
const T = { // screen text per language; the tour text itself lives in tour.json / tour.es.json
  en: { file: 'tour.json', hint: 'Tap Start, then walk. Audio plays at each stop.', idle: 'Not started', start: 'Start', pause: 'Pause', play: 'Play',
        read: 'Read along', intro: 'Introduction', done: 'Tour finished. Obrigado!', next: (n, d) => `Next stop: ${n}, ${d} m away`,
        noGps: 'Turn on location to follow the tour.', demo: 'Test mode: tap Start, then move the mouse (or tap) on the map to "walk".',
        back: (a, b) => `Welcome back: ${a} of ${b} heard.`, over: 'Start over' },
  es: { file: 'tour.es.json', hint: 'Toca Empezar y camina. El audio suena en cada parada.', idle: 'Sin empezar', start: 'Empezar', pause: 'Pausa', play: 'Seguir',
        read: 'Leer el texto', intro: 'Introducción', done: '¡Recorrido terminado. Obrigado!', next: (n, d) => `Próxima parada: ${n}, a ${d} m`,
        noGps: 'Activa la ubicación para seguir el recorrido.', demo: 'Modo prueba: toca Empezar y mueve el mouse (o toca) el mapa para "caminar".',
        back: (a, b) => `Bienvenido de nuevo: llevas ${a} de ${b}.`, over: 'Empezar de nuevo' },
};
const lang = T[params.get('lang')] ? params.get('lang') : navigator.language.startsWith('es') ? 'es' : 'en';
const t = T[lang];
const $ = id => document.getElementById(id);
let tour, markers = [], played = new Set(), started = false, me, last, nums = [];
const save = () => { try { localStorage.setItem('played:' + tour.title, JSON.stringify([...played])); } catch {} };
const load = () => { try { return JSON.parse(localStorage.getItem('played:' + tour.title)) || []; } catch { return []; } };

const map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

function dist(a, b) { // metres between two lat/lng points
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function icon(i) { // numbered circle for a stop, small dot for walking directions
  const done = played.has(i) ? 'done' : '';
  return tour.stops[i].kind === 'walk'
    ? L.divIcon({ className: '', iconSize: [12, 12], html: `<div class="dot ${done}"></div>` })
    : L.divIcon({ className: '', iconSize: [28, 28], html: `<div class="num ${done}">${nums[i]}</div>` });
}

function play(i) { // i = -1 is the intro
  audio.src = `${tour.audio || 'audio'}/${i + 1}.mp3`;
  audio.play();
  const s = tour.stops[i];
  $('now').textContent = i < 0 ? t.intro : s.kind === 'walk' ? `🚶 ${s.name}` : `${nums[i]}. ${s.name}`;
  $('words').textContent = i < 0 ? tour.intro : s.text;
  $('btn').textContent = t.pause;
  if (i >= 0) { played.add(i); markers[i].setIcon(icon(i)); save(); }
}

function onMove(pos) {
  last = pos;
  me ? me.setLatLng(pos) : me = L.circleMarker(pos, { radius: 8, color: '#1a73e8', fillOpacity: 1 }).addTo(map);
  // ponytail: plays any unplayed stop in range, not only the next one; fine for a linear walk
  const hit = tour.stops.findIndex((s, i) => !played.has(i) && dist(pos, s) < RADIUS);
  if (hit >= 0 && audio.paused) play(hit);
  const next = tour.stops.findIndex((s, i) => !played.has(i) && s.kind !== 'walk');
  if (next < 0) { $('status').textContent = t.done; return; }
  const d = Math.round(dist(pos, tour.stops[next]));
  $('status').textContent = t.next(tour.stops[next].name, d);
}

$('btn').onclick = async () => {
  if (!started) {
    started = true;
    play(-1); // first play inside a tap, so phones allow audio later
    try { await navigator.wakeLock?.request('screen'); } catch {} // GPS stops when the screen locks
    if (!demo) navigator.geolocation.watchPosition(
      p => onMove({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => $('status').textContent = t.noGps,
      { enableHighAccuracy: true });
    return;
  }
  if (audio.paused) { audio.play(); $('btn').textContent = t.pause; }
  else { audio.pause(); $('btn').textContent = t.play; }
};
audio.onended = () => { $('btn').textContent = t.play; if (last) onMove(last); }; // play anything reached while talking
$('speed').onclick = () => { // 1x → 1.25x → 1.5x → 1x
  audio.playbackRate = audio.playbackRate >= 1.5 ? 1 : audio.playbackRate + 0.25;
  $('speed').textContent = audio.playbackRate + 'x';
};
audio.onplay = () => audio.playbackRate = parseFloat($('speed').textContent); // new src resets the speed

$('lang').value = lang;
$('lang').onchange = e => { params.set('lang', e.target.value); location.search = params; };
$('status').textContent = demo ? t.demo : t.hint;
$('now').textContent = t.idle;
$('btn').textContent = t.start;
$('readAlong').textContent = t.read;

fetch(t.file).then(r => r.json()).then(tr => {
  tour = tr;
  $('title').textContent = tour.title;
  let n = 0; nums = tour.stops.map(s => s.kind === 'walk' ? 0 : ++n);
  load().forEach(i => played.add(i)); // pick up where you left off
  if (played.size) {
    $('now').innerHTML = `${t.back(played.size, tour.stops.length)} <button id="reset" class="small">${t.over}</button>`;
    $('reset').onclick = () => { played.clear(); save(); location.reload(); };
  }
  const pts = tour.stops.map(s => [s.lat, s.lng]);
  L.polyline(pts, { color: '#c8102e', dashArray: '6 8' }).addTo(map);
  markers = tour.stops.map((s, i) => L.marker([s.lat, s.lng], { icon: icon(i) })
    .addTo(map).bindTooltip(s.name).on('click', () => started && play(i)));
  map.fitBounds(pts, { padding: [30, 30] });
  if (demo) map.on('click mousemove', e => started && onMove(e.latlng)); // mouse on computer, tap on phone
});
</script>
</body>
</html>
